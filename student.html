<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit a ticket &middot; TicketTriage</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a href="landing.html" style="text-decoration:none;"><div class="brand">Ticket<span>Triage</span></div></a>
    <nav class="site">
      <a href="student.html" class="active">Submit a ticket</a>
      <a href="admin.html">Admin review</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>Submit a support request</h1>
    <p class="lede">Tell us what you need help with. The system suggests a category automatically, so you can leave the category blank unless you already know where it belongs.</p>

    <div id="banner"></div>

    <form class="ticket-panel" onsubmit="return false;">
      <div class="ticket-stripe"></div>
      <div class="ticket-panel-body">
        
        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div>
            <label for="full-name">Full name</label>
            <input id="full-name" type="text">
          </div>

          <div>
            <label for="email">Email address</label>
            <input id="email" type="email">
          </div>

          <div>
            <label for="title">Short title</label>
            <input id="title" type="text" placeholder="Cannot access campus Wi-Fi">
          </div>

          <div>
            <label for="description">Description - the more detail, the better the category suggestion</label>
            <textarea id="description" rows="4">I cannot connect to the campus Wi-Fi</textarea>
          </div>

          <div>
            <label for="priority">Priority - optional</label>
            <select id="priority">
              <option value="medium">Medium</option>
              <option value="low">Low</option>
              <option value="high">High</option>
            </select>
          </div>

          <div>
            <label for="category">Category - optional, leave blank to auto-detect</label>
            <select id="category">
              <option value="">Suggest one for me</option>
            </select>
          </div>

          <div style="display:flex; gap:8px; margin-top:8px;">
            <button id="submit">Submit ticket</button>
            <button id="clear" class="ghost">Clear</button>
          </div>
        </div>

      </div>
    </form>
  </div>
</main>

<footer class="site">
  <div class="wrap">AI-200 Capstone &middot; TicketTriage &middot; Azure free-tier reference build</div>
</footer>

<script type="module" src="/js/student.js"></script>
</body>
</html>
